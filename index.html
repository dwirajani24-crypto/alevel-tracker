<style>
  /* ---------------------------------------------------------------------
     Custom styles that go beyond Tailwind utility classes.
     Kept small and commented so it's easy to re-theme later.
  --------------------------------------------------------------------- */

  :root {
    /* Status colours — edit these 4 lines to re-theme the whole app */
    --status-not-started: #CBD5E1;   /* grey    */
    --status-learning:    #FCA88C;   /* red/orange */
    --status-revising:    #FBD874;   /* yellow  */
    --status-confident:   #86E3B0;   /* green   */

    --status-not-started-text: #475569;
    --status-learning-text:    #9A3B12;
    --status-revising-text:    #8A5A00;
    --status-confident-text:   #0F6B41;
  }

  html, body {
    background: #F5F6FB;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  h1, h2, h3, .font-display { font-family: 'Sora', sans-serif; }

  /* Respect iPhone/iPad safe areas so content isn't hidden by notches/home bar */
  .safe-top    { padding-top: env(safe-area-inset-top); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  .safe-x      { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }

  /* Smooth, subtle transitions used throughout */
  .transition-soft { transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1); }

  /* Custom scrollbar for the subject tab strip (desktop) */
  .tab-strip::-webkit-scrollbar { height: 0px; }
  .tab-strip { scrollbar-width: none; -ms-overflow-style: none; }

  /* Status select — visually a pill, functionally a native <select> so it is
     screen-reader + keyboard friendly, while the whole row still cycles on tap. */
  .status-select {
    appearance: none;
    -webkit-appearance: none;
    background-image: none;
    font-family: 'Inter', sans-serif;
  }

  /* Progress ring donut using conic-gradient, driven by a CSS variable set in JS */
  .progress-ring {
    --pct: 0;
    background: conic-gradient(var(--ring-color, #6366F1) calc(var(--pct) * 1%), #E7E9F5 0);
    border-radius: 9999px;
    display: grid;
    place-items: center;
  }
  .progress-ring::before {
    content: '';
    position: absolute;
  }

  /* Collapsible notes area animation */
  .notes-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .notes-wrap.open { grid-template-rows: 1fr; }
  .notes-inner { overflow: hidden; min-height: 0; }

  /* Section (term/week block) chevron rotation */
  .chevron { transition: transform 0.18s ease; }
  .section-open .chevron { transform: rotate(180deg); }

  /* Section body collapse */
  .section-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .section-open .section-body { grid-template-rows: 1fr; }
  .section-body-inner { overflow: hidden; min-height: 0; }

  /* Touch-friendly minimum target size (Apple HIG: 44x44pt) */
  .tap-target { min-height: 44px; }

  /* Panel swipe track for subject pages */
  #panelTrack {
    display: flex;
    width: 400%;
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    touch-action: pan-y;
  }
  .panel {
    width: 25%;
    flex-shrink: 0;
  }

  /* Simple fade-in for filtered results */
  .topic-row { transition: opacity 0.15s ease, transform 0.15s ease; }
  .topic-row[hidden] { display: none; }

  /* Toast */
  #toast {
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  ::selection { background: #C7D2FE; }
</style>

/* Status definitions — order matters (this is the tap-cycle order). */
const STATUSES = [
  { key: 'not-started', label: 'Not Started', color: 'var(--status-not-started)', text: 'var(--status-not-started-text)' },
  { key: 'learning',    label: 'Learning',    color: 'var(--status-learning)',    text: 'var(--status-learning-text)' },
  { key: 'revising',    label: 'Revising',    color: 'var(--status-revising)',    text: 'var(--status-revising-text)' },
  { key: 'confident',   label: 'Confident',   color: 'var(--status-confident)',   text: 'var(--status-confident-text)' },
];
const STATUS_WEIGHT = { 'not-started': 0, 'learning': 1/3, 'revising': 2/3, 'confident': 1 };

/* -------------------------------------------------------------------------
   2. STATE + STORAGE
------------------------------------------------------------------------- */
const STORAGE_KEY = 'alevel-tracker-data-v1';

/** topicState: { [topicId]: { status: 'not-started'|'learning'|'revising'|'confident', notes: string } } */
let topicState = {};
let activeSubjectIndex = 0;
let searchQuery = '';
let toastTimer = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    topicState = raw ? JSON.parse(raw) : {};
  } catch (e) {
    console.warn('Could not read saved progress, starting fresh.', e);
    topicState = {};
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(topicState));
  } catch (e) {
    console.warn('Could not save progress (localStorage unavailable/full).', e);
  }
}

function getTopic(id) {
  if (!topicState[id]) topicState[id] = { status: 'not-started', notes: '' };
  return topicState[id];
}

/* -------------------------------------------------------------------------
   3. DERIVED HELPERS
------------------------------------------------------------------------- */

// Deterministic id: subject-section-group-item indices, so ids are stable
// across reloads as long as the data above isn't reordered.
function topicId(subjectId, si, gi, ii) {
  return `${subjectId}__s${si}__g${gi}__t${ii}`;
}

function forEachTopicInSubject(subject, cb) {
  subject.sections.forEach((section, si) => {
    section.groups.forEach((group, gi) => {
      group.items.forEach((text, ii) => {
        cb({ id: topicId(subject.id, si, gi, ii), text, section, group, si, gi, ii });
      });
    });
  });
}

function subjectProgress(subject) {
  let total = 0, weightSum = 0;
  forEachTopicInSubject(subject, ({ id }) => {
    total += 1;
    weightSum += STATUS_WEIGHT[getTopic(id).status];
  });
  return total === 0 ? 0 : Math.round((weightSum / total) * 100);
}

function subjectStatusCounts(subject) {
  const counts = { 'not-started': 0, 'learning': 0, 'revising': 0, 'confident': 0 };
  forEachTopicInSubject(subject, ({ id }) => { counts[getTopic(id).status]++; });
  return counts;
}

function overallProgress() {
  let total = 0, weightSum = 0;
  SUBJECTS.forEach((subject) => {
    forEachTopicInSubject(subject, ({ id }) => {
      total += 1;
      weightSum += STATUS_WEIGHT[getTopic(id).status];
    });
  });
  return total === 0 ? 0 : Math.round((weightSum / total) * 100);
}

function overallStatusCounts() {
  const counts = { 'not-started': 0, 'learning': 0, 'revising': 0, 'confident': 0 };
  SUBJECTS.forEach((subject) => {
    forEachTopicInSubject(subject, ({ id }) => { counts[getTopic(id).status]++; });
  });
  return counts;
}

function statusMeta(key) { return STATUSES.find(s => s.key === key); }

function nextStatus(key) {
  const idx = STATUSES.findIndex(s => s.key === key);
  return STATUSES[(idx + 1) % STATUSES.length].key;
}

/* -------------------------------------------------------------------------
   4. RENDERING
------------------------------------------------------------------------- */

const tabStrip = document.getElementById('tabStrip');

const overallSummaryText = document.getElementById('overallSummaryText');

const noResultsMsg = document.getElementById('noResultsMsg');
const noResultsQuery = document.getElementById('noResultsQuery');

function renderTabs() {
  tabStrip.innerHTML = '';
  SUBJECTS.forEach((subject, i) => {
    const pct = subjectProgress(subject);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.role = 'tab';
    btn.setAttribute('aria-selected', i === activeSubjectIndex ? 'true' : 'false');
    btn.dataset.index = i;
    btn.className = `tap-target shrink-0 flex items-center gap-2 pl-3 pr-3.5 py-2 rounded-2xl border text-sm font-medium transition-soft select-none ` +
      (i === activeSubjectIndex
        ? 'bg-ink text-white border-ink shadow-soft'
        : 'bg-card text-ink/80 border-black/5 hover:border-black/10 shadow-softer');
    btn.innerHTML = `
      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${subject.color}"></span>
      <span>${subject.short}</span>
      <span class="text-[11px] font-normal ${i === activeSubjectIndex ? 'text-white/70' : 'text-muted'}">${pct}%</span>
    `;
    btn.addEventListener('click', () => setActiveSubject(i, true));
    tabStrip.appendChild(btn);
  });
}

function renderOverall() {
  const pct = overallProgress();
  overallRing.style.setProperty('--pct', pct);
  overallPercentLabel.textContent = pct + '%';

  const counts = overallStatusCounts();
  const total = SUBJECTS.reduce((acc, s) => acc + countTopics(s), 0);
  const confidentCount = counts['confident'];
  overallSummaryText.textContent = total === 0
    ? 'No topics yet.'
    : `${confidentCount} of ${total} topics confident · ${pct}% overall`;

  overallBreakdown.innerHTML = STATUSES.map(s => `
    <span class="inline-flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full" style="background:${s.color}"></span>
      ${s.label} <span class="font-medium text-ink/70">${counts[s.key]}</span>
    </span>
  `).join('');
}

function countTopics(subject) {
  let n = 0;
  forEachTopicInSubject(subject, () => n++);
  return n;
}

function renderPanels() {
  panelTrack.innerHTML = '';
  SUBJECTS.forEach((subject, i) => {
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.dataset.index = i;
    panel.appendChild(renderSubjectPanel(subject));
    panelTrack.appendChild(panel);
  });
}

function renderSubjectPanel(subject) {
  const wrap = document.createElement('div');

  // Subject progress card
  const pct = subjectProgress(subject);
  const counts = subjectStatusCounts(subject);
  const header = document.createElement('div');
  header.className = 'rounded-3xl p-4 sm:p-5 mb-4 shadow-softer border border-black/5';
  header.style.background = subject.colorSoft;
  header.innerHTML = `
    <div class="flex items-center justify-between gap-3 mb-3">
      <div>
        <h2 class="font-display font-bold text-lg" style="color:${darken(subject.color)}">${subject.name}</h2>
        <p class="text-xs text-muted mt-0.5">${countTopics(subject)} topics</p>
      </div>
      <div class="font-display font-extrabold text-2xl" style="color:${subject.color}">${pct}<span class="text-sm font-semibold">%</span></div>
    </div>
    <div class="w-full h-2.5 rounded-full bg-black/5 overflow-hidden">
      <div class="h-full rounded-full transition-soft" style="width:${pct}%; background:${subject.color}"></div>
    </div>
    <div class="flex flex-wrap gap-x-3 gap-y-1 mt-3 text-[11px] text-muted">
      ${STATUSES.map(s => `<span class="inline-flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full" style="background:${s.color}"></span>${s.label} ${counts[s.key]}</span>`).join('')}
    </div>
  `;
  wrap.appendChild(header);

  // Sections
  const sectionsWrap = document.createElement('div');
  sectionsWrap.className = 'space-y-3';
  subject.sections.forEach((section, si) => {
    sectionsWrap.appendChild(renderSection(subject, section, si));
  });
  wrap.appendChild(sectionsWrap);

  return wrap;
}

function darken(hex) {
  // Small helper: returns a darker version of a hex colour for text-on-tint use.
  const c = hex.replace('#', '');
  const num = parseInt(c, 16);
  let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  r = Math.round(r * 0.62); g = Math.round(g * 0.62); b = Math.round(b * 0.62);
  return `rgb(${r},${g},${b})`;
}

function renderSection(subject, section, si) {
  const details = document.createElement('div');
  details.className = 'rounded-2xl bg-card border border-black/5 shadow-softer overflow-hidden section-open';
  details.dataset.sectionLabel = section.label.toLowerCase();

  const topicId0 = `sec-${subject.id}-${si}`;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tap-target w-full flex items-center justify-between gap-3 px-4 py-3 text-left';
  btn.setAttribute('aria-expanded', 'true');
  btn.innerHTML = `
    <span class="font-display font-semibold text-sm">${section.label}</span>
    <svg class="chevron w-4 h-4 text-muted shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  `;
  btn.addEventListener('click', () => {
    const isOpen = details.classList.toggle('section-open');
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  });
  details.appendChild(btn);

  const bodyOuter = document.createElement('div');
  bodyOuter.className = 'section-body';
  const bodyInner = document.createElement('div');
  bodyInner.className = 'section-body-inner';

  const bodyPad = document.createElement('div');
  bodyPad.className = 'px-3 pb-3 space-y-4';

  section.groups.forEach((group, gi) => {
    const groupWrap = document.createElement('div');
    if (group.label) {
      const groupTitle = document.createElement('p');
      groupTitle.className = 'text-[11px] font-semibold uppercase tracking-wide text-muted px-1 mb-1.5';
      groupTitle.textContent = group.label;
      groupWrap.appendChild(groupTitle);
    }
    const list = document.createElement('div');
    list.className = 'space-y-1.5';
    group.items.forEach((text, ii) => {
      list.appendChild(renderTopicRow(subject, section, group, si, gi, ii, text));
    });
    groupWrap.appendChild(list);
    bodyPad.appendChild(groupWrap);
  });

  bodyInner.appendChild(bodyPad);
  bodyOuter.appendChild(bodyInner);
  details.appendChild(bodyOuter);

  return details;
}

function renderTopicRow(subject, section, group, si, gi, ii, text) {
  const id = topicId(subject.id, si, gi, ii);
  const data = getTopic(id);
  const meta = statusMeta(data.status);

  const row = document.createElement('div');
  row.className = 'topic-row rounded-xl border border-black/5 bg-white/60 overflow-hidden';
  row.dataset.searchText = text.toLowerCase();

  const main = document.createElement('div');
  main.className = 'tap-target w-full flex items-center gap-2.5 px-3 py-2.5 cursor-pointer active:scale-[0.99] transition-soft';
  main.setAttribute('role', 'button');
  main.setAttribute('tabindex', '0');
  main.setAttribute('aria-label', `${text} — status ${meta.label}. Tap to change status.`);

  // Status dot + native select (looks like a pill, works like a real <select>)
  const selectWrap = document.createElement('div');
  selectWrap.className = 'relative shrink-0';
  const select = document.createElement('select');
  select.className = 'status-select tap-target text-[11px] font-semibold rounded-full pl-2.5 pr-6 py-1.5 border-0 outline-none cursor-pointer transition-soft';
  select.setAttribute('aria-label', 'Change status');
  STATUSES.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.key;
    opt.textContent = s.label;
    if (s.key === data.status) opt.selected = true;
    select.appendChild(opt);
  });
  applyStatusColors(select, meta);
  select.addEventListener('click', (e) => e.stopPropagation());
  select.addEventListener('change', (e) => {
    setStatus(id, e.target.value);
  });
  const caret = document.createElement('svg');
  caret.setAttribute('viewBox', '0 0 24 24');
  caret.setAttribute('fill', 'none');
  caret.className = 'w-3 h-3 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none';
  caret.innerHTML = `<path d="M6 9l6 6 6-6" stroke="${meta.text}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  selectWrap.appendChild(select);
  selectWrap.appendChild(caret);

  // Topic text
  const label = document.createElement('span');
  label.className = 'flex-1 text-sm leading-snug';
  label.textContent = text;

  // Notes toggle button
  const notesBtn = document.createElement('button');
  notesBtn.type = 'button';
  notesBtn.className = 'tap-target shrink-0 w-9 h-9 grid place-items-center rounded-full text-muted hover:bg-black/5 transition-soft';
  const hasNotes = !!(data.notes && data.notes.trim());
  notesBtn.setAttribute('aria-label', hasNotes ? 'Edit note' : 'Add note');
  notesBtn.innerHTML = `
    <svg class="w-4 h-4" fill="${hasNotes ? 'currentColor' : 'none'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
    </svg>
  `;
  notesBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleNotes(row, id);
  });

  main.appendChild(selectWrap);
  main.appendChild(label);
  main.appendChild(notesBtn);

  // Tapping anywhere else on the row cycles the status
  main.addEventListener('click', () => setStatus(id, nextStatus(getTopic(id).status)));
  main.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setStatus(id, nextStatus(getTopic(id).status));
    }
  });

  row.appendChild(main);

  // Notes (collapsible)
  const notesWrap = document.createElement('div');
  notesWrap.className = 'notes-wrap' + (hasNotes ? ' open' : '');
  notesWrap.dataset.notesFor = id;
  const notesInner = document.createElement('div');
  notesInner.className = 'notes-inner';
  const notesPad = document.createElement('div');
  notesPad.className = 'px-3 pb-3 pt-0';
  const textarea = document.createElement('textarea');
  textarea.rows = 2;
  textarea.placeholder = 'e.g. redo past paper Q4…';
  textarea.value = data.notes || '';
  textarea.className = 'w-full text-sm rounded-xl border border-black/10 bg-canvas/60 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-300 transition-soft resize-none';
  textarea.addEventListener('click', (e) => e.stopPropagation());
  textarea.addEventListener('input', (e) => {
    getTopic(id).notes = e.target.value;
    saveState();
  });
  notesPad.appendChild(textarea);
  notesInner.appendChild(notesPad);
  notesWrap.appendChild(notesInner);
  row.appendChild(notesWrap);

  return row;
}

function applyStatusColors(el, meta) {
  el.style.background = meta.color;
  el.style.color = meta.text;
}

function toggleNotes(row, id) {
  const notesWrap = row.querySelector(`[data-notes-for="${CSS.escape(id)}"]`);
  notesWrap.classList.toggle('open');
  if (notesWrap.classList.contains('open')) {
    setTimeout(() => notesWrap.querySelector('textarea').focus({ preventScroll: true }), 200);
  }
}

function setStatus(id, statusKey) {
  getTopic(id).status = statusKey;
  saveState();
  // Re-render just the affected bits for snappy feel, but simplest/most
  // correct is a full re-render of tabs + overall + current panel.
  renderTabs();
  renderOverall();
  refreshCurrentPanel();
}

// Re-render only the currently visible subject panel (keeps other panels'
// open/closed section state untouched and avoids jank while swiping).
function refreshCurrentPanel() {
  const panels = panelTrack.children;
  const subject = SUBJECTS[activeSubjectIndex];
  const openSections = new Set();
  const panelEl = panels[activeSubjectIndex];
  panelEl.querySelectorAll('.section-open').forEach(el => openSections.add(el.dataset.sectionLabel));
  const openNotes = new Set();
  panelEl.querySelectorAll('.notes-wrap.open').forEach(el => openNotes.add(el.dataset.notesFor));

  panelEl.innerHTML = '';
  panelEl.appendChild(renderSubjectPanel(subject));

  panelEl.querySelectorAll('[data-section-label]').forEach(el => {
    if (!openSections.has(el.dataset.sectionLabel)) el.classList.remove('section-open');
  });
  panelEl.querySelectorAll('.notes-wrap').forEach(el => {
    if (openNotes.has(el.dataset.notesFor)) el.classList.add('open');
  });

  applySearchFilter();
}

/* -------------------------------------------------------------------------
   5. EVENTS — tabs, swipe, search
------------------------------------------------------------------------- */

function setActiveSubject(index, animate) {
  activeSubjectIndex = index;
  panelTrack.style.transition = animate ? '' : 'none';
  panelTrack.style.transform = `translateX(-${index * 25}%)`;
  if (!animate) requestAnimationFrame(() => { panelTrack.style.transition = ''; });
  renderTabs();
  // Scroll the active tab into view on small screens
  const activeBtn = tabStrip.querySelector(`[data-index="${index}"]`);
  if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

// --- Swipe gesture between subject panels -----------------------------
let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, isSwiping = false;
const panelViewport = document.getElementById('panelViewport');

panelViewport.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchDeltaX = 0;
  isSwiping = false;
}, { passive: true });

panelViewport.addEventListener('touchmove', (e) => {
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  if (!isSwiping && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) isSwiping = true;
  if (isSwiping) {
    touchDeltaX = dx;
    const base = -activeSubjectIndex * 25;
    const dragPct = (dx / panelViewport.clientWidth) * 25;
    panelTrack.style.transition = 'none';
    panelTrack.style.transform = `translateX(${base + dragPct}%)`;
  }
}, { passive: true });

panelViewport.addEventListener('touchend', () => {
  panelTrack.style.transition = '';
  if (!isSwiping) return;
  const threshold = panelViewport.clientWidth * 0.18;
  if (touchDeltaX < -threshold && activeSubjectIndex < SUBJECTS.length - 1) {
    setActiveSubject(activeSubjectIndex + 1, true);
  } else if (touchDeltaX > threshold && activeSubjectIndex > 0) {
    setActiveSubject(activeSubjectIndex - 1, true);
  } else {
    setActiveSubject(activeSubjectIndex, true); // snap back
  }
  isSwiping = false;
});

// --- Search / filter -----------------------------------------------------
const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearchBtn');

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  clearSearchBtn.hidden = searchQuery.length === 0;
  applySearchFilter();
});
clearSearchBtn.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  clearSearchBtn.hidden = true;
  applySearchFilter();
  searchInput.focus();
});

function applySearchFilter() {
  let anyMatchAnywhere = false;
  Array.from(panelTrack.children).forEach((panelEl) => {
    let anyMatchInPanel = false;
    panelEl.querySelectorAll('.topic-row').forEach((row) => {
      const match = !searchQuery || row.dataset.searchText.includes(searchQuery);
      row.hidden = !match;
      if (match) anyMatchInPanel = true;
    });
    // Show/hide whole section blocks + auto-expand sections with matches
    panelEl.querySelectorAll('[data-section-label]').forEach((section) => {
      const visibleRows = section.querySelectorAll('.topic-row:not([hidden])');
      section.style.display = (searchQuery && visibleRows.length === 0) ? 'none' : '';
      if (searchQuery && visibleRows.length > 0) section.classList.add('section-open');
    });
    if (anyMatchInPanel) anyMatchAnywhere = true;
  });

  const activePanel = panelTrack.children[activeSubjectIndex];
  const activeHasMatch = !searchQuery || activePanel.querySelectorAll('.topic-row:not([hidden])').length > 0;
  noResultsMsg.hidden = activeHasMatch;
  noResultsQuery.textContent = searchInput.value.trim();
}

/* -------------------------------------------------------------------------
   6. INIT + SERVICE WORKER
------------------------------------------------------------------------- */
function init() {
  loadState();
  renderTabs();
  renderOverall();
  renderPanels();
  setActiveSubject(0, false);
  applySearchFilter();
}
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
